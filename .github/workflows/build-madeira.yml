name: Build Madeira Custom IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Windows Runtimes (VC++)
        run: |
          echo "Creando carpetas e inyectando librerías VC++..."
          mkdir -p app/Resources/redist || true
          mkdir -p Resources/redist || true
          curl -L -o vc_redist.x64.exe https://aka.ms
          cp vc_redist.x64.exe app/Resources/redist/ 2>/dev/null || true
          cp vc_redist.x64.exe Resources/redist/ 2>/dev/null || true

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Build Dependencies
        run: |
          echo "Instalando dependencias de C++..."
          brew install xcbeautify cmake ninja

      - name: Build IPA via Script
        run: |
          echo "Buscando y ejecutando el script oficial..."
          chmod +x ./tools/build_ipa.sh 2>/dev/null || true
          chmod +x ./**/tools/build_ipa.sh 2>/dev/null || true
          
          if [ -f "./tools/build_ipa.sh" ]; then
            ./tools/build_ipa.sh
          else
            # Si está escondido en un submódulo, lo ejecutamos desde ahí
            SCRIPT_PATH=$(find . -name "build_ipa.sh" -print -quit)
            if [ ! -z "$SCRIPT_PATH" ]; then
              chmod +x "$SCRIPT_PATH"
              cd $(dirname "$SCRIPT_PATH")/.. && ./tools/build_ipa.sh
            else
              echo "No se encontró el script, forzando compilación manual xcodebuild"
              xcodebuild -workspace *.xcworkspace -scheme Madeira -configuration Release -archivePath build/Madeira.xcarchive archive
              xcodebuild -exportArchive -archivePath build/Madeira.xcarchive -exportPath build/ -exportOptionsPlist tools/exportOptions.plist
            fi
          fi

      - name: Upload Custom IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Custom-VC-IPA
          path: "**/*.ipa"
