name: Build Madeira Custom IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Windows Runtimes (VC++)
        run: |
          echo "Creando carpetas de recursos..."
          mkdir -p app/Resources/redist 2>/dev/null || true
          mkdir -p Resources/redist 2>/dev/null || true
          curl -L -o vc_redist.x64.exe https://aka.ms
          cp vc_redist.x64.exe app/Resources/redist/ 2>/dev/null || true
          cp vc_redist.x64.exe Resources/redist/ 2>/dev/null || true

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Build Dependencies
        run: |
          echo "Instalando dependencias de C++..."
          brew install xcbeautify cmake ninja

      - name: Compile App
        run: |
          echo "Buscando y compilando el proyecto..."
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          
          if [ ! -z "$PROJECT_PATH" ]; then
            cd $(dirname "$PROJECT_PATH")
            echo "Proyecto encontrado en: $PROJECT_PATH"
            # Forzamos la compilación para un dispositivo iOS físico real, evitando simuladores
            xcodebuild -project *.xcodeproj -scheme Madeira -configuration Release -destination 'generic/platform=iOS' -archivePath build/Madeira.xcarchive archive NO_CODE_SIGNING=YES CODE_SIGNING_ALLOWED=NO
            
            # Empaquetamos la app compilada en formato .ipa manualmente
            mkdir -p build/Payload
            cp -r build/Madeira.xcarchive/Products/Applications/*.app build/Payload/ 2>/dev/null || cp -r build/Madeira.xcarchive/Products/Applications/Madeira.app build/Payload/ || true
            cd build && zip -r Madeira.ipa Payload/
          else
            echo "No se encontró ningún archivo .xcodeproj"
            exit 1
          fi

      - name: Upload Custom IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Custom-VC-IPA
          path: "**/build/*.ipa"
