name: Build Madeira Custom IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Windows Runtimes (VC++)
        run: |
          echo "Descargando e inyectando librerías VC++..."
          mkdir -p app/Resources/redist
          curl -L -o app/Resources/redist/vc_redist.x64.exe https://aka.ms

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Build Dependencies
        run: |
          echo "Instalando dependencias del sistema..."
          brew install xcbeautify cmake ninja

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install Flutter Packages
        run: |
          echo "Descargando paquetes de Flutter..."
          flutter pub get

      - name: Build IPA via Flutter
        run: |
          echo "Compilando la aplicación Madeira..."
          flutter build ipa --release --no-codesign

      - name: Upload Custom IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Custom-VC-IPA
          path: build/ios/ipa/*.ipa
