name: Build Madeira Custom IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Windows Runtimes (VC++)
        run: |
          echo "Creando carpetas de recursos..."
          mkdir -p app/Resources/redist 2>/dev/null || true
          mkdir -p Resources/redist 2>/dev/null || true
          curl -L -o vc_redist.x64.exe https://aka.ms
          cp vc_redist.x64.exe app/Resources/redist/ 2>/dev/null || true
          cp vc_redist.x64.exe Resources/redist/ 2>/dev/null || true

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Build Dependencies
        run: |
          echo "Instalando dependencias de C++..."
          brew install xcbeautify cmake ninja

      - name: Compile App
        run: |
          echo "Localizando el proyecto de Xcode de forma agresiva..."
          # Busca cualquier espacio de trabajo de Xcode (.xcworkspace)
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          
          if [ ! -z "$WORKSPACE_PATH" ]; then
            cd $(dirname "$WORKSPACE_PATH")
            echo "Proyecto encontrado en: $WORKSPACE_PATH"
            xcodebuild -workspace *.xcworkspace -scheme Madeira -configuration Release -archivePath build/Madeira.xcarchive archive NO_CODE_SIGNING=YES
            xcodebuild -exportArchive -archivePath build/Madeira.xcarchive -exportPath build/ -exportOptionsPlist tools/exportOptions.plist 2>/dev/null || mkdir -p build/Payload && cp -r build/Madeira.xcarchive/Products/Applications/*.app build/Payload/ && cd build && zip -r Madeira.ipa Payload/
          else
            # Si es un proyecto plano (.xcodeproj)
            PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
            cd $(dirname "$PROJECT_PATH")
            echo "Proyecto plano encontrado en: $PROJECT_PATH"
            xcodebuild -project *.xcodeproj -scheme Madeira -configuration Release -archivePath build/Madeira.xcarchive archive NO_CODE_SIGNING=YES
            mkdir -p build/Payload && cp -r build/Madeira.xcarchive/Products/Applications/*.app build/Payload/ && cd build && zip -r Madeira.ipa Payload/
          fi

      - name: Upload Custom IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Custom-VC-IPA
          path: "**/*.ipa"
