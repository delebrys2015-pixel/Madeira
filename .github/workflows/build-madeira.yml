name: Build Madeira Custom IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Windows Runtimes (VC++)
        run: |
          echo "Descargando e inyectando librerías VC++ con el nombre exacto de Xcode..."
          # Creamos la carpeta de la app por si acaso
          mkdir -p app/Madeira
          
          # Descargamos el instalador usando exactamente el nombre 'x86_64-vcruntime'
          curl -L -o x86_64-vcruntime https://aka.ms
          
          # Lo copiamos en todas las ubicaciones posibles dentro del proyecto para que Xcode lo vea sí o sí
          cp x86_64-vcruntime app/
          cp x86_64-vcruntime app/Madeira/
          cp x86_64-vcruntime app/Madeira/Resources/ 2>/dev/null || true

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Build Dependencies
        run: |
          echo "Instalando dependencias de C++..."
          brew install xcbeautify cmake ninja

      - name: Compile App
        run: |
          echo "Compilando el proyecto..."
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          
          if [ ! -z "$PROJECT_PATH" ]; then
            cd $(dirname "$PROJECT_PATH")
            echo "Proyecto encontrado en: $PROJECT_PATH"
            
            xcodebuild -project *.xcodeproj -scheme Madeira -configuration Release -destination 'generic/platform=iOS' -archivePath build/Madeira.xcarchive archive NO_CODE_SIGNING=YES CODE_SIGNING_ALLOWED=NO
            
            mkdir -p build/Payload
            cp -r build/Madeira.xcarchive/Products/Applications/*.app build/Payload/ 2>/dev/null || cp -r build/Madeira.xcarchive/Products/Applications/Madeira.app build/Payload/ || true
            cd build && zip -r Madeira.ipa Payload/
          else
            echo "No se encontró ningún archivo .xcodeproj"
            exit 1
          fi

      - name: Upload Custom IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Custom-VC-IPA
          path: "**/build/*.ipa"
