name: Build Madeira Custom IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Windows Runtimes (VC++)
        run: |
          echo "Descargando e inyectando librerías VC++..."
          mkdir -p Resources/redist || mkdir -p app/Resources/redist || true
          curl -L -o vc_redist.x64.exe https://aka.ms
          cp vc_redist.x64.exe Resources/redist/ 2>/dev/null || cp vc_redist.x64.exe app/Resources/redist/ 2>/dev/null || true

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Build Dependencies
        run: |
          echo "Instalando dependencias del sistema..."
          brew install xcbeautify cmake ninja

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Find and Install Flutter Packages
        run: |
          echo "Buscando la raíz de Flutter automáticamente..."
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
          elif [ -f "app/pubspec.yaml" ]; then
            cd app && flutter pub get
          else
            echo "Buscando pubspec.yaml dinámicamente..."
            cd $(dirname $(find . -name "pubspec.yaml" -print -quit)) && flutter pub get
          fi

      - name: Build IPA via Flutter
        run: |
          echo "Compilando la aplicación Madeira..."
          if [ -f "pubspec.yaml" ]; then
            flutter build ipa --release --no-codesign
          elif [ -f "app/pubspec.yaml" ]; then
            cd app && flutter build ipa --release --no-codesign
          else
            cd $(dirname $(find . -name "pubspec.yaml" -print -quit)) && flutter build ipa --release --no-codesign
          fi

      - name: Upload Custom IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Custom-VC-IPA
          path: "**/build/ios/ipa/*.ipa"
